<title>Settimana nel piatto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root {
  --ground: #f2f5f3;
  --surface: #ffffff;
  --sunk: #e8eeea;
  --ink: #16201c;
  --muted: #56645e;
  --line: #d6dfda;
  --accent: #cf4a26;
  --accent-soft: #fbe6de;
  --ok: #2f7d4f;
  --warn: #a8570f;
  --warn-soft: #fcefdc;
  --uova: #b98510;
  --formaggio: #4f70a8;
  --legumi: #8f5a30;
  --vegetale: #357a4c;
  --libero: #7a5aa6;
  --focus: #1b64d1;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  --f-num: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111714; --surface: #19211d; --sunk: #202a25; --ink: #e5ece8; --muted: #9eaca6; --line: #2d3833;
    --accent: #ff7a52; --accent-soft: #3a2119; --ok: #6cc28d; --warn: #f0a656; --warn-soft: #3a2a15;
    --uova: #e2b441; --formaggio: #8ea9dc; --legumi: #cf9464; --vegetale: #6fc08a; --libero: #b597de; --focus: #7fb0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111714; --surface: #19211d; --sunk: #202a25; --ink: #e5ece8; --muted: #9eaca6; --line: #2d3833;
  --accent: #ff7a52; --accent-soft: #3a2119; --ok: #6cc28d; --warn: #f0a656; --warn-soft: #3a2a15;
  --uova: #e2b441; --formaggio: #8ea9dc; --legumi: #cf9464; --vegetale: #6fc08a; --libero: #b597de; --focus: #7fb0ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; padding-inline: 16px; padding-block: 0 48px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1060px; margin: 0 auto; }
.num { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.1; text-wrap: balance; }

/* ---------- testata ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 20px 14px; }
.brand h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; }
.weeknav button:hover { border-color: var(--muted); }
.weeklabel { min-width: 13.5em; text-align: center; }
.weeklabel b { display: block; font-size: 17px; }
.weeklabel span { font-size: 14px; color: var(--muted); }
.weeklabel .phase { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--ink); color: var(--surface); margin-left: 4px; }

/* ---------- passi ---------- */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--sunk); padding: 5px; border-radius: 14px; margin-bottom: 18px; }
.steps button { border: 0; background: transparent; border-radius: 10px; padding: 10px 8px; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: center; }
.steps button .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 14px; border: 2px solid var(--muted); color: var(--muted); }
.steps button .t { font-weight: 700; font-size: 16px; line-height: 1.15; }
.steps button .s { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.steps button[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.steps button[aria-selected="true"] .n { background: var(--ink); border-color: var(--ink); color: var(--surface); }

.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 15px; }
.banner button { border: 0; background: var(--ink); color: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

/* ---------- striscia dei giorni ---------- */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.day-btn { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px 9px; cursor: pointer; text-align: center; }
.day-btn .dn { font-family: var(--f-display); font-weight: 800; font-size: 17px; }
.day-btn .dd { font-size: 13px; color: var(--muted); }
.day-btn .tr { display: block; margin: 5px auto 0; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 4px; color: var(--muted); }
.day-btn.is-train .tr { background: var(--accent-soft); color: var(--accent); }
.day-btn[aria-pressed="true"] { border: 2px solid var(--ink); padding: 7px 3px 8px; }
.day-btn .today { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 0 6px; }
.view-toggle { display: flex; gap: 6px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 15px; font-weight: 600; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }

/* ---------- layout principale ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* ---------- giornata ---------- */
.dayhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 12px; }
.dayhead h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
.dayhead .kind { font-size: 15px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.dayhead .kind.train { background: var(--accent-soft); color: var(--accent); }
.timeline { display: grid; gap: 10px; }
.slot { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; }
.slot .when { padding-top: 12px; text-align: right; }
.slot .when b { display: block; font-size: 15px; }
.slot .when span { font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .slot { grid-template-columns: 1fr; gap: 4px; } .slot .when { text-align: left; padding-top: 4px; display: flex; gap: 8px; align-items: baseline; } }

.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px; position: relative; }
.meal.g-uova { border-left: 6px solid var(--uova); }
.meal.g-formaggio { border-left: 6px solid var(--formaggio); }
.meal.g-legumi { border-left: 6px solid var(--legumi); }
.meal.g-vegetale { border-left: 6px solid var(--vegetale); }
.meal.g-libero { border-left: 6px solid var(--libero); }
.meal.train { background: var(--accent-soft); border-color: transparent; }
.meal.small { padding: 9px 14px; }
.meal-h { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.meal-h h3 { font-family: var(--f-body); font-weight: 700; font-size: 18px; line-height: 1.25; }
.tag { flex: none; font-size: 12.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; }
.tag.uova { background: var(--uova); } .tag.formaggio { background: var(--formaggio); } .tag.legumi { background: var(--legumi); } .tag.vegetale { background: var(--vegetale); } .tag.libero { background: var(--libero); }
:root[data-theme="dark"] .tag { color: #111714; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { color: #111714; } }
.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.items li { display: contents; }
.items .q { text-align: right; font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.items .w small { color: var(--muted); font-size: 14px; }
.items li.extra .w, .items li.extra .q { color: var(--muted); }
.note { margin: 7px 0 0; font-size: 14.5px; color: var(--warn); }
.edit-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none; }
.edit-btn:hover { border-color: var(--muted); }
.editor { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 12px; }
.editor label { display: grid; gap: 3px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.editor select { font-size: 15px; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }

/* ---------- colonna laterale ---------- */
.side { display: grid; gap: 14px; position: sticky; top: 12px; }
@media (max-width: 860px) { .side { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.panel h3 { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
.quota { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.quota li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 15px; }
.quota .dot { width: 12px; height: 12px; border-radius: 3px; }
.quota .val { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.quota .val.ok { color: var(--ok); }
.quota .val.bad { color: var(--warn); }
.quota .val::after { content: " ✓"; }
.quota .val.bad::after { content: " !"; }
.quota .rng { color: var(--muted); font-weight: 400; }
.side .hint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.daily { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 15px; }
.daily b { font-family: var(--f-num); }
.btn { border: 0; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; font-size: 15px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- vista settimana ---------- */
.weekgrid-wrap { overflow-x: auto; }
.weekgrid { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); gap: 8px; min-width: 1000px; }
.wcol { display: grid; gap: 6px; align-content: start; }
.wcol-h { text-align: center; padding: 6px 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.wcol-h b { font-family: var(--f-display); font-size: 16px; }
.wcol-h span { display: block; font-size: 12px; color: var(--muted); }
.wcol-h.train { background: var(--accent-soft); border-color: transparent; }
.wcol-h.train span { color: var(--accent); font-weight: 700; }
.wcell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 13.5px; line-height: 1.3; }
.wcell i { display: block; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
.wcell.g-uova { border-left: 5px solid var(--uova); } .wcell.g-formaggio { border-left: 5px solid var(--formaggio); } .wcell.g-legumi { border-left: 5px solid var(--legumi); } .wcell.g-vegetale { border-left: 5px solid var(--vegetale); } .wcell.g-libero { border-left: 5px solid var(--libero); }
.wcell.train { background: var(--accent-soft); border-color: transparent; }

/* ---------- impostazioni ---------- */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.section h2 { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
.section > p { margin: 0 0 12px; color: var(--muted); font-size: 15px; max-width: 62ch; }
.trow { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.trow:first-of-type { border-top: 0; }
.trow .lbl { font-weight: 700; }
.trow .lbl span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--sunk); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 4px; font-size: 14px; font-weight: 600; cursor: pointer; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.seg button[aria-pressed="true"].t { background: var(--accent); color: #fff; }
.trctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg2 { grid-template-columns: repeat(2, auto); }
.seg2 button { padding: 7px 12px; }
.tfield { display: inline-flex; gap: 6px; align-items: center; font-size: 15px; font-weight: 600; }
.tfield input, .tfield select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-family: var(--f-num); font-weight: 700; font-size: 15px; }
.kindtxt { flex-basis: 100%; font-size: 14px; color: var(--muted); }
@media (max-width: 520px) { .trow { grid-template-columns: 1fr; gap: 4px; } }
.fieldrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.fieldrow select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.switch { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.switch input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.likes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.likes-grid .section { margin-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 11px; font-size: 15px; cursor: pointer; text-align: left; line-height: 1.25; }
.chip small { display: block; font-size: 12.5px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.chip[aria-pressed="true"]::before { content: "✓ "; font-weight: 700; }
.sub-h { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
.sub-h:first-of-type { margin-top: 0; }
.sect-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; z-index: 10; }
.foot { margin-top: 26px; font-size: 13.5px; color: var(--muted); max-width: 72ch; }

@media (max-width: 640px) {
  .steps button { flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px; }
  .steps button .s { display: none; }
  .days { gap: 4px; }
  .day-btn .dn { font-size: 15px; }
  .day-btn .tr { font-size: 10.5px; }
  .items { gap: 4px 9px; }
  .items .q { font-size: 15px; }
  .brand h1 { font-size: 25px; }
  .weeknav { width: 100%; }
  .weeklabel { min-width: 0; flex: 1; }
  .steps button .t { font-size: 14px; }
  .toolbar .btns { width: 100%; }
  .toolbar .btns .btn { flex: 1; }
  .meal-h { flex-wrap: wrap; }
  .meal-h h3 { flex: 1 1 60%; }
}
@media (prefers-reduced-motion: no-preference) {
  .meal, .wcell { transition: background-color .2s ease; }
}
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  body { background: #fff; padding: 0; font-size: 12px; }
  .steps, .banner, .weeknav button, .side, .toolbar, .days, .edit-btn, .foot, .view-toggle { display: none !important; }
  .main { display: block; }
  .weekgrid { min-width: 0; }
  .wcell { font-size: 10.5px; }
}
</style>
